{% extends 'index.html' %}
{% load static %}
{% block title %}
<title>Eshop | Add New Product</title>
{% endblock %}

{% block body %}

<style>
    button.btn:hover {
        transform: scale(1.02);
    }
</style>


<div class="container my-5">
    <div class="card shadow-lg p-4 bg-light rounded-3">
        <h3 class="text-center mb-4 text-primary fw-bold">Add New Product</h3>

        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Seller Name -->
            <div class="mb-4">
                <label for="name" class="form-label fw-semibold">Seller Name</label>
                <input type="text" class="form-control form-control-lg" name="name" placeholder="Enter Seller Name">
            </div>

            <!-- Categories & Stock -->
            <div class="row g-3 mb-4">
                <div class="col-md-3 col-sm-6 col-12">
                    <label for="maincategory" class="form-label fw-semibold">Main Category</label>
                    <select name="maincategory" class="form-select form-select-lg">
                        {% for i in MainCat %}
                            <option value="{{i}}">{{i}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-3 col-sm-6 col-12">
                    <label for="subcategory" class="form-label fw-semibold">Sub Category</label>
                    <select name="subcategory" class="form-select form-select-lg">
                        {% for i in SubCat %}
                            <option value="{{i}}">{{i}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-3 col-sm-6 col-12">
                    <label for="brand" class="form-label fw-semibold">Brand</label>
                    <select name="brand" class="form-select form-select-lg">
                        {% for i in Brand %}
                            <option value="{{i}}">{{i}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-3 col-sm-6 col-12">
                    <label for="stock" class="form-label fw-semibold">Stock</label>
                    <select name="stock" class="form-select form-select-lg">
                        <option value="In Stock">In Stock</option>
                        <option value="Out of Stock">Out of Stock</option>
                    </select>
                </div>
            </div>

            <!-- Pricing & Attributes -->
            <div class="row g-3 mb-4">
                <div class="col-sm-6 col-12">
                    <label for="baseprice" class="form-label fw-semibold">Base Price</label>
                    <input type="number" class="form-control form-control-lg" name="baseprice" placeholder="Enter Base Price">
                </div>

                <div class="col-sm-6 col-12">
                    <label for="discount" class="form-label fw-semibold">Discount (%)</label>
                    <input type="number" class="form-control form-control-lg" name="discount" placeholder="Enter Discount">
                </div>

                <div class="col-sm-6 col-12">
                    <label for="color" class="form-label fw-semibold">Color</label>
                    <input type="text" class="form-control form-control-lg" name="color" placeholder="Enter Color">
                </div>

                <div class="col-sm-6 col-12">
                    <label for="size" class="form-label fw-semibold">Size</label>
                    <input type="text" class="form-control form-control-lg" name="size" placeholder="Enter Size">
                </div>
            </div>

            <!-- Product Images -->
            <div class="row g-3 mb-4">
                {% for i in "1234" %}
                <div class="col-md-3 col-sm-6 col-12">
                    <label for="pic{{i}}" class="form-label fw-semibold">Pic{{i}}</label>
                    <input type="file" class="form-control form-control-lg" name="pic{{i}}">
                </div>
                {% endfor %}
            </div>

            <!-- Description -->
            <div class="mb-4">
                <label for="description" class="form-label fw-semibold">Description</label>
                <textarea class="form-control form-control-lg" name="description" rows="5" placeholder="Enter Product Description"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm" style="transition: transform 0.2s;">
                Add Product
            </button>
        </form>
    </div>
</div>

<!-- Optional: Hover effect for button -->

{% endblock %}
