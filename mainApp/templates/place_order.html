{% extends 'index.html' %}
{% load static %}
{% load cart %}
{% block title %}
<title>Mshop | placae_order Page</title>
{% endblock %}

{% block body %}

<style>
    body {
        background: #f5f7fa;
    }

    .success-card {
        max-width: 600px;
        margin: auto;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 40px 30px;
        text-align: center;
        background: #fff;
    }

    /* Animated Circle */
    .checkmark-circle {
        width: 100px;
        height: 100px;
        margin: auto;
    }

    .checkmark-circle svg {
        width: 100%;
        height: 100%;
    }

    .circle {
        stroke-dasharray: 314;
        stroke-dashoffset: 314;
        stroke: #28a745;
        stroke-width: 5;
        fill: none;
        animation: drawCircle 0.6s ease-out forwards;
    }

    .check {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        stroke: #28a745;
        stroke-width: 5;
        fill: none;
        animation: drawCheck 0.4s 0.6s  ease-out forwards;
    }

    @keyframes drawCircle {
        to { stroke-dashoffset: 0; }
    }

    @keyframes drawCheck {
        to { stroke-dashoffset: 0; }
    }

    .success-title {
        font-weight: 600;
        margin-top: 20px;
    }

    .success-text {
        color: #666;
        font-size: 15px;
    }

    .btn-custom {
        border-radius: 30px;
        padding: 10px 20px;
        min-width: 160px;
    }
</style>

<br><br><br>


<div class="container mt-5">
    <div class="success-card">

        <!-- Animated Tick -->
        <div class="checkmark-circle">
            <svg viewBox="0 0 100 100">
                <circle class="circle" cx="50" cy="50" r="45"/>
                <path class="check" d="M30 52 L45 65 L70 35"/>
            </svg>
        </div>

        <!-- Heading -->
        <h3 class="success-title text-success">
            🎉 Order Confirmed!
        </h3>

        <!-- Message -->
        <p class="success-text">
            Your order has been placed successfully. <br>
            We’ll start processing it right away.
        </p>

        <!-- Buttons -->
        <div class="mt-4 d-flex justify-content-center gap-3 flex-wrap">

            <a href="/shop/All/All/All/" class="btn btn-primary btn-custom">
                🛍 Continue Shopping
            </a>

            <a href="/" class="btn btn-outline-secondary btn-custom">
                🏠 Go to Home
            </a>

        </div>

    </div>
</div>

{% endblock %}
