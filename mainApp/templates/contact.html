{% extends 'index.html' %}
{% load static %}

{% block title %}
<title>Eshop | Contact</title>
{% endblock %}

{% block body %}
<style>
    .contact-card {
        background: linear-gradient(45deg, #0d6efd, #6610f2);
        color: white;
        border-radius: 12px;
        transition: 0.3s;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .contact-card:hover {
        transform: translateY(-5px);
    }

    .contact-title {
        background: linear-gradient(45deg, #0d6efd, #6610f2);
        border-radius: 10px;
        letter-spacing: 1px;
    }

    .contact-form {
        border-radius: 15px;
        background: rgba(255,255,255,0.9);
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .form-control {
        border-radius: 25px;
        padding: 10px 15px;
        border: 1px solid #ddd;
        transition: 0.3s;
    }

    .form-control:focus {
        border-color: #6610f2;
        box-shadow: 0 0 8px rgba(102,16,242,0.3);
    }

    textarea.form-control {
        border-radius: 15px;
    }

    .contact-btn {
        border-radius: 30px;
        background: linear-gradient(45deg, #0d6efd, #6610f2);
        border: none;
        font-weight: 500;
        transition: 0.3s;
    }

    .contact-btn:hover {
        background: linear-gradient(45deg, #6610f2, #0d6efd);
    }

    iframe {
        border-radius: 15px;
    }
</style>
<br><br><br>



<div class="container mt-4">
    <div class="row g-4">

        <!-- LEFT SIDE -->
        <div class="col-md-6">

            <div class="contact-card text-center p-3 mb-3">
                📧 gkapoor2612@gmail.com
            </div>

            <div class="contact-card text-center p-3 mb-3">
                📞 6204780974
            </div>

            <div class="contact-card text-center p-3 mb-3">
                📍 Alpha-1, Greater Noida, UP
            </div>

            <!-- MAP -->
            <div class="w-100 shadow">
                <iframe 
                    class="w-100"
                    height="400"
                    src="https://maps.google.com/maps?q=Alpha%201,%20Greater%20noida,%20UP&t=&z=13&ie=UTF8&iwloc=&output=embed"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy">
                </iframe>
            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="col-md-6">

            <h5 class="text-light p-3 text-center contact-title">
                📩 Get In Touch
            </h5>

            <!-- MESSAGES -->
            {% for i in messages %}
            <div class="alert alert-danger alert-dismissible fade show mt-2 shadow-sm" role="alert">
                {{ i }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}

            <!-- FORM -->
            <form action="" method="post" class="mt-3 p-4 contact-form">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Name</label>
                    <input type="text" class="form-control" name="name" placeholder="Enter your name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Phone</label>
                    <input type="text" class="form-control" name="phone" placeholder="Enter phone number">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Subject</label>
                    <input type="text" class="form-control" name="subject" placeholder="Enter subject">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Message</label>
                    <textarea rows="5" class="form-control" name="message" placeholder="Write your message..."></textarea>
                </div>

                <button type="submit" class="btn contact-btn w-100 text-light">
                    🚀 Send Message
                </button>

            </form>

        </div>

    </div>
</div>

{% endblock %}
