{% extends 'index.html' %}
{% load static %}
{% block title %}
<title>Mshop | Verify OTP</title>
{% endblock %}

{% block body %}
<br><br><br>

<div class="container-fluid mt-2">
    <div class="row">

        <!-- LEFT IMAGE -->
        <div class="col-md-6 col-sm-12 col-12">
            <img src="{% static 'images/forget.avif' %}" class="w-100" height="500px">
        </div>

        <!-- RIGHT FORM -->
        <div class="col-md-6 col-sm-12 col-12">
            <h5 class="background text-light text-center w-100 p-2">
                Verify OTP 🔐
            </h5>

            {% for i in messages %}
                <div class="alert alert-danger text-center">
                    {{ i }}
                </div>
            {% endfor %}

            <!-- ✅ FIXED ACTION -->
            <form action="{% url 'verify_otp' %}" method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">OTP</label>
                    <input type="text" 
                           class="form-control rounded-pill" 
                           name="otp" 
                           placeholder="Enter OTP" 
                           required>
                </div>

                <button type="submit" 
                        class="btn btn-primary w-100 rounded-pill fw-bold">
                    Submit OTP
                </button>

                <!-- ✅ Navigation links -->
                <div class="text-center mt-3">
                    <a href="{% url 'forget_password' %}" class="text-decoration-none">
                        Resend OTP
                    </a> |
                    <a href="{% url 'login' %}" class="text-decoration-none">
                        Back to Login
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}
