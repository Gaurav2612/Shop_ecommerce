{% extends 'index.html' %}
{% load static %}
{% block title %}
<title>Eshop | SignUp</title>
{% endblock %}

{% block body %}

<style>
    body {
        background:
            linear-gradient(rgba(13, 110, 253, 0.6), rgba(102, 16, 242, 0.7)),
            url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        overflow-x: hidden;
    }

    /* Center container */
    .signup-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Premium glass card */
    .signup-card {
        max-width: 520px;
        margin: auto;
        background: rgba(0, 0, 0, 0.4);
        /* darker glass */
        backdrop-filter: blur(20px);
        border-radius: 25px;
        box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Smooth animation */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Form section */
    .form-section {
        padding: 40px 35px;
        background: transparent;
    }

    /* Title */
    .form-title {
        font-weight: 700;
        margin-bottom: 25px;
        color: #fff;
        text-align: center;
        letter-spacing: 1px;
    }

    /* Labels */
    .form-label {
        color: rgba(255, 255, 255, 0.85);
        font-size: 14px;
        margin-bottom: 5px;
    }

    /* Inputs */
    .form-control {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
    }

    /* Placeholder */
    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.6);
    }

    /* Focus effect */
    .form-control:focus {
        border-color: #fff;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        background: rgba(255, 255, 255, 0.15);
        transform: scale(1.02);
        color: #fff;
    }

    /* Select */
    select.form-control {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
    }

    /* Button */
    .btn-signup {
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        color: #fff;
    }

    .btn-signup:hover {
        background: linear-gradient(45deg, #0072ff, #00c6ff);
        box-shadow: 0 0 20px rgba(0, 114, 255, 0.6);
    }

    /* Login link */
    .login-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
        color: #fff;
        opacity: 0.75;
        transition: 0.3s;
    }

    .login-link:hover {
        opacity: 1;
        text-decoration: underline;
    }

    /* Alert */
    .alert {
        border-radius: 12px;
        background: rgba(255, 0, 0, 0.25);
        color: #fff;
        border: none;
        font-size: 14px;
    }

    /* Extra spacing */
    .mb-3 {
        margin-bottom: 18px !important;
    }
</style>

<br><br><br>
<div class="container signup-container">
    <div class="row signup-card w-100">



        <!-- RIGHT FORM -->
        <div class="col-md-6 col-12">
            <div class="form-section">

                <h4 class="form-title">📝 Create Account</h4>

                {% for i in messages %}
                <div class="alert alert-danger">
                    {{i}}
                </div>
                {% endfor %}

                <form action="{% url 'signup' %}" method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="name" placeholder="Enter Your Name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">User Name</label>
                        <input type="text" class="form-control" name="username" placeholder="Enter Username">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" name="email" placeholder="Enter Email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" name="phone" placeholder="Enter Phone Number">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Enter Password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" name="cpassword" placeholder="Confirm Password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Account Type</label>
                        <select name="actype" class="form-control">
                            <option value="seller">Seller</option>
                            <option value="buyer">Buyer</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-signup text-white w-100">
                        Sign Up
                    </button>

                    <a href="/login" class="login-link">
                        Already have an account? Login
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
